<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff6e8">
  <meta name="description" content="A tiny interactive slime pet that lives in your browser.">
  <title>Pet Slime</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .play-panel,
    .stage {
      min-height: 360px;
      height: 360px;
    }

    .floating-settings {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 40;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .floating-settings .settings-toggle {
      position: relative;
      width: 34px;
      height: 34px;
      margin: 0 0 0 auto;
      pointer-events: auto;
      touch-action: manipulation;
      font-size: 1.15rem;
      background: rgba(255,255,255,.82);
      box-shadow: 0 6px 18px rgba(46,91,69,.14);
    }

    .floating-settings .settings-menu {
      position: absolute;
      right: 0;
      bottom: 43px;
      z-index: 41;
      width: 176px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .floating-settings .settings-menu[hidden] { display: none !important; }

    .floating-settings .settings-menu button {
      width: 100%;
      margin-top: 6px;
      padding: 10px 11px;
      border: 1px solid rgba(255,255,255,.84);
      border-radius: 14px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 8px 22px rgba(52,94,74,.12);
      backdrop-filter: blur(14px);
      text-align: left;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .floating-settings .howto-panel {
      margin: 6px 0 0;
      padding: 10px 11px;
      border: 1px solid rgba(255,255,255,.84);
      border-radius: 14px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 8px 22px rgba(52,94,74,.12);
      backdrop-filter: blur(14px);
      pointer-events: auto;
    }

    @media (max-width: 420px) {
      .play-panel,
      .stage {
        min-height: 330px;
        height: 330px;
      }

      .floating-settings {
        right: 8px;
        bottom: 8px;
      }

      .floating-settings .settings-toggle {
        width: 34px;
        height: 34px;
        font-size: 1.05rem;
      }

      .floating-settings .settings-menu {
        width: min(178px, 62vw);
        bottom: 42px;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="pet-name">
    <section class="pet-shell">
      <header class="panel top-panel">
        <p class="eyebrow">PET SLIME</p>
        <h1 id="pet-name">Mochi</h1>
        <p id="message" class="message" aria-live="polite">Mochi is happy to see you.</p>
      </header>

      <section class="play-panel" aria-label="Slime playground">
        <div id="stage" class="stage" aria-label="Mochi's play area">
          <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
          <div id="toy" class="toy" aria-hidden="true"></div>
          <div id="food" class="food" aria-hidden="true">🍓</div>
          <div id="sleep-fx" class="sleep-fx" aria-hidden="true"><span>Z</span><span>z</span><span>z</span></div>

          <div id="slime" class="slime" role="img" aria-label="A happy slime" tabindex="0">
            <span class="shine" aria-hidden="true"></span>
            <span class="eye eye-left" aria-hidden="true"></span>
            <span class="eye eye-right" aria-hidden="true"></span>
            <span class="mouth" aria-hidden="true"></span>
          </div>
          <span id="slime-shadow" class="slime-shadow" aria-hidden="true"></span>
        </div>

        <div class="floating-settings" aria-label="Pet settings">
          <div id="settings-menu" class="settings-menu" hidden>
            <button id="rename" type="button">Rename</button>
            <button id="slime-color" type="button">Slime color</button>
            <button id="background" type="button">Background</button>
            <button id="howto" type="button" aria-expanded="false">How to</button>
            <div id="howto-panel" class="howto-panel" hidden>
              <strong>Play with your slime</strong>
              <span>Tap · double tap · hold · rub · drag · toss</span>
              <span>Feed, play, rest, and pet buttons each have their own reaction.</span>
            </div>
            <button id="reset" type="button">Reset</button>
          </div>
          <button id="settings-toggle" class="settings-toggle" type="button" aria-label="Open settings" aria-expanded="false">+</button>
        </div>
      </section>

      <section class="panel bottom-panel" aria-label="Pet status and actions">
        <section class="stats" aria-label="Pet stats">
          <div class="stat">
            <div class="stat-label"><span>Happiness</span><strong id="happiness-value">80</strong></div>
            <progress id="happiness" max="100" value="80">80%</progress>
          </div>
          <div class="stat">
            <div class="stat-label"><span>Fullness</span><strong id="fullness-value">70</strong></div>
            <progress id="fullness" max="100" value="70">70%</progress>
          </div>
          <div class="stat">
            <div class="stat-label"><span>Energy</span><strong id="energy-value">85</strong></div>
            <progress id="energy" max="100" value="85">85%</progress>
          </div>
        </section>

        <section class="actions" aria-label="Care actions">
          <button type="button" data-action="feed"><span class="action-icon">🍓</span><span>Feed</span></button>
          <button type="button" data-action="play"><span class="action-icon">🧶</span><span>Play</span></button>
          <button type="button" data-action="rest"><span class="action-icon">🌙</span><span>Rest</span></button>
          <button type="button" data-action="pet"><span class="action-icon">💚</span><span>Pet</span></button>
        </section>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
