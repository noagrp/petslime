<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff6e8">
  <meta name="description" content="A tiny interactive slime pet that lives in your browser.">
  <title>Pet Slime</title>
  <link rel="stylesheet" href="styles.css?v=20260923-25">
  <style>
    .panel {
      background:rgba(255,255,255,.44)!important;
      border-color:rgba(255,255,255,.64)!important;
      box-shadow:0 14px 38px rgba(52,94,74,.08)!important;
      backdrop-filter:blur(14px) saturate(1.08)!important;
      -webkit-backdrop-filter:blur(14px) saturate(1.08)!important;
    }
    .play-panel,.stage{min-height:360px;height:360px}

    .care-sheet{
      position:absolute;left:10px;top:50%;z-index:26;width:90px;padding:7px;
      border:1px solid rgba(255,255,255,.58);border-radius:18px;background:rgba(255,255,255,.38);
      box-shadow:0 10px 28px rgba(52,94,74,.10);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      transform:translate(-118%,-50%) scale(.9);opacity:0;pointer-events:none;
      transition:transform .2s ease,opacity .16s ease;
    }
    .care-sheet.open{transform:translate(0,-50%) scale(1);opacity:1;pointer-events:auto}
    .care-grid{display:grid;grid-template-columns:repeat(2,34px);justify-content:center;gap:7px}
    .care-option{
      width:34px;height:34px;padding:0;border:1px solid rgba(255,255,255,.72);border-radius:50%;
      background:rgba(255,255,255,.7);box-shadow:0 5px 13px rgba(52,94,74,.08);
      display:grid;place-items:center;color:#395447;cursor:pointer;touch-action:manipulation;
      transition:transform .14s ease,background .14s ease,box-shadow .14s ease;
    }
    .care-option:hover{transform:translateY(-1px)}
    .care-option:active{transform:scale(.93)}
    .care-option.active{background:rgba(255,255,255,.96);box-shadow:0 0 0 3px rgba(91,176,131,.16),0 6px 15px rgba(52,94,74,.11)}
    .care-option span:last-child{display:none}

    .play-mini{position:relative;display:block;width:22px;height:22px}
    .bubbles-mini::before,.bubbles-mini::after{content:"";position:absolute;border:2px solid #72b7ca;border-radius:50%}
    .bubbles-mini::before{width:12px;height:12px;left:1px;top:7px}
    .bubbles-mini::after{width:8px;height:8px;right:0;top:1px;box-shadow:-1px 13px 0 -2px rgba(114,183,202,.85)}

    .floating-settings{position:absolute;right:12px;top:12px;z-index:60;pointer-events:auto;touch-action:manipulation;overflow:visible}
    .floating-settings .settings-toggle{position:relative;z-index:62;display:grid!important;visibility:visible!important;opacity:1!important;width:34px;height:34px;margin:0 0 0 auto;pointer-events:auto;touch-action:manipulation;font-size:1.15rem;background:rgba(255,255,255,.78);box-shadow:0 6px 18px rgba(46,91,69,.14)}
    .floating-settings .settings-menu{position:absolute;right:0;top:43px;z-index:61;width:176px;padding:0;border:0;background:transparent;box-shadow:none;backdrop-filter:none;pointer-events:auto;touch-action:manipulation}
    .floating-settings .settings-menu[hidden]{display:none!important}
    .floating-settings .settings-menu button{width:100%;margin-top:6px;padding:10px 11px;border:1px solid rgba(255,255,255,.84);border-radius:14px;background:rgba(255,255,255,.86);box-shadow:0 8px 22px rgba(52,94,74,.11);backdrop-filter:blur(14px);text-align:left;pointer-events:auto;touch-action:manipulation}
    .floating-settings .howto-panel{margin:6px 0 0;padding:10px 11px;border:1px solid rgba(255,255,255,.84);border-radius:14px;background:rgba(255,255,255,.9);box-shadow:0 8px 22px rgba(52,94,74,.11);backdrop-filter:blur(14px);pointer-events:auto}

    .particle.food-crumb{color:#d96f82;font-size:.72rem!important;font-weight:900;text-shadow:0 1px 0 rgba(255,255,255,.45);animation:particleRise .6s ease-out forwards}
    .particle.apple-bit{color:#84a94f}.particle.cookie-bit{color:#a86f42}.particle.grape-bit{color:#8664af}.particle.melon-bit{color:#ef7580}.particle.carrot-bit{color:#e9983e}
    .particle.ball-pop{color:#5f89bb;font-weight:800}.particle.bubble-pop{color:#79b9c9;font-weight:800}
    .particle.tv-note{color:#8b78b6}.particle.shower-drop{color:#62a9d1;font-weight:900}
    .particle.command-spark{color:#e4ad49;font-weight:900}.particle.command-peace{color:#8664af;font-weight:900}.particle.command-wave{color:#63a98a}.particle.command-hide{color:#587064}.particle.command-dust{color:#a58a67}

    .toy.emoji-toy{display:block;width:52px;height:52px;margin:0;background:none;box-shadow:none;opacity:0;pointer-events:none;filter:drop-shadow(0 5px 5px rgba(44,69,57,.12))}
    .toy.emoji-toy.show{opacity:1}

    .toy.home-tv,.toy.home-shower,.toy.home-bed{color:transparent;filter:none}
    .toy.home-tv{left:50%;bottom:50px;width:88px;height:70px;z-index:3}
    .toy.home-tv::before{content:"";position:absolute;inset:0 5px 10px;border-radius:10px;border:5px solid #4e5a57;background:linear-gradient(145deg,#bfe2ee,#8fb9cd 55%,#dce8e5);box-shadow:0 8px 18px rgba(50,69,62,.18)}
    .toy.home-tv::after{content:"";position:absolute;left:29px;bottom:0;width:28px;height:10px;border-radius:4px 4px 2px 2px;background:#59635f}
    .toy.home-tv.show{animation:tvRest 5.6s ease both}
    @keyframes tvRest{0%{opacity:0;transform:translate(98px,8px) scale(.76)}12%,88%{opacity:1;transform:translate(62px,0) scale(1)}100%{opacity:0;transform:translate(62px,0) scale(.94)}}

    .toy.home-shower{left:50%;bottom:206px;width:88px;height:54px;z-index:7}
    .toy.home-shower::before{content:"";position:absolute;left:22px;top:8px;width:52px;height:18px;border-radius:14px 14px 7px 7px;background:#728b95;box-shadow:inset 0 -5px 0 rgba(55,78,86,.18),0 6px 12px rgba(45,67,72,.15);transform:rotate(8deg)}
    .toy.home-shower::after{content:"";position:absolute;left:54px;top:-3px;width:8px;height:24px;border-radius:8px;background:#728b95}
    .toy.home-shower.show{animation:showerHover 4.8s ease both}
    @keyframes showerHover{0%{opacity:0;transform:translate(10px,-22px) scale(.78)}12%,88%{opacity:1;transform:translate(10px,0) scale(1)}100%{opacity:0;transform:translate(10px,5px) scale(.9)}}

    .toy.home-bed{left:50%;bottom:24px;width:210px;height:74px;z-index:2}
    .toy.home-bed::before{content:"";position:absolute;left:-105px;bottom:0;width:210px;height:48px;border-radius:18px 18px 13px 13px;background:linear-gradient(#d6d1ec,#bbb3dc);border:4px solid rgba(95,86,135,.16);box-shadow:0 10px 18px rgba(62,63,88,.15)}
    .toy.home-bed::after{content:"";position:absolute;left:-91px;bottom:35px;width:70px;height:30px;border-radius:16px;background:#f5f1fb;box-shadow:0 3px 8px rgba(80,73,105,.09)}

    .slime.cmd-highfive{animation:cmdHighFive 1.8s cubic-bezier(.2,.78,.25,1) both;z-index:12}
    @keyframes cmdHighFive{0%,100%{transform:translate3d(var(--x),var(--y),0) scale(1)}18%{transform:translate3d(var(--x),calc(var(--y) + 12px),0) scale(1.12,.76)}48%{transform:translate3d(var(--x),calc(var(--y) - 72px),0) scale(1.58)}60%{transform:translate3d(var(--x),calc(var(--y) - 62px),0) scale(1.5)}82%{transform:translate3d(var(--x),calc(var(--y) + 4px),0) scale(1.13,.82)}}
    .slime.cmd-peace{animation:cmdPeace 2.1s ease both}.slime.cmd-peace .eye{height:5px;top:66px;box-shadow:none}
    @keyframes cmdPeace{0%,100%{transform:translate3d(var(--x),var(--y),0)}25%{transform:translate3d(calc(var(--x) - 8px),calc(var(--y) - 10px),0) rotate(-5deg)}55%{transform:translate3d(calc(var(--x) + 8px),calc(var(--y) - 15px),0) rotate(5deg) scale(1.04)}80%{transform:translate3d(var(--x),calc(var(--y) - 6px),0)}}
    .slime.cmd-wave{animation:cmdWave 3s ease-in-out both}
    @keyframes cmdWave{0%,100%{transform:translate3d(var(--x),var(--y),0) scale(1)}18%{transform:translate3d(calc(var(--x) - 4px),calc(var(--y) - 4px),0) scale(.82) rotate(-7deg)}38%{transform:translate3d(calc(var(--x) + 4px),calc(var(--y) - 12px),0) scale(.6) rotate(7deg)}56%{transform:translate3d(calc(var(--x) - 3px),calc(var(--y) - 20px),0) scale(.46) rotate(-6deg)}70%{transform:translate3d(calc(var(--x) + 2px),calc(var(--y) - 18px),0) scale(.5) rotate(5deg)}84%{transform:translate3d(var(--x),calc(var(--y) - 7px),0) scale(.78) rotate(-3deg)}}
    .slime.cmd-hide-left{animation:cmdHideLeft 3s ease both}.slime.cmd-hide-right{animation:cmdHideRight 3s ease both}
    @keyframes cmdHideLeft{0%,100%{transform:translate3d(var(--x),var(--y),0)}25%,72%{transform:translate3d(calc(var(--x) - 185px),var(--y),0) rotate(-4deg)}48%{transform:translate3d(calc(var(--x) - 168px),var(--y),0) rotate(4deg)}}
    @keyframes cmdHideRight{0%,100%{transform:translate3d(var(--x),var(--y),0)}25%,72%{transform:translate3d(calc(var(--x) + 185px),var(--y),0) rotate(4deg)}48%{transform:translate3d(calc(var(--x) + 168px),var(--y),0) rotate(-4deg)}}
    .slime.cmd-dig{animation:cmdDig 3s ease both}@keyframes cmdDig{0%,100%{transform:translate3d(var(--x),var(--y),0)}24%{transform:translate3d(var(--x),calc(var(--y) + 45px),0) scale(1.08,.82)}44%,70%{transform:translate3d(var(--x),calc(var(--y) + 116px),0) scale(.96)}82%{transform:translate3d(var(--x),calc(var(--y) + 45px),0) scale(1.08,.82)}}
    .slime.cmd-dance{animation:cmdDance 3.3s ease-in-out both}@keyframes cmdDance{0%,100%{transform:translate3d(var(--x),var(--y),0)}12%{transform:translate3d(calc(var(--x) - 24px),calc(var(--y) - 18px),0) rotate(-10deg) scale(1.05)}26%{transform:translate3d(calc(var(--x) + 24px),calc(var(--y) - 6px),0) rotate(10deg)}40%{transform:translate3d(calc(var(--x) - 20px),calc(var(--y) - 25px),0) rotate(-8deg)}54%{transform:translate3d(calc(var(--x) + 22px),calc(var(--y) - 8px),0) rotate(9deg)}68%{transform:translate3d(calc(var(--x) - 15px),calc(var(--y) - 20px),0) rotate(-7deg)}84%{transform:translate3d(calc(var(--x) + 12px),calc(var(--y) - 5px),0) rotate(6deg)}}

    @media(max-width:420px){
      .play-panel,.stage{min-height:340px;height:340px}
      .stage{touch-action:pan-y}
      .slime{touch-action:none}
      .care-sheet{left:6px;width:84px;padding:6px}
      .care-grid{grid-template-columns:repeat(2,32px);gap:6px}
      .care-option{width:32px;height:32px}
      .play-mini{transform:scale(.9)}
      .floating-settings{right:8px;top:8px}
      .floating-settings .settings-toggle{width:34px;height:34px;font-size:1.05rem}
      .floating-settings .settings-menu{width:min(178px,62vw);top:42px}
      .toy.home-tv{width:82px;height:64px}
      .toy.home-tv::after{left:26px;width:26px}
      .toy.home-bed{width:190px}
      .toy.home-bed::before{left:-95px;width:190px}
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="pet-name">
    <section class="pet-shell">
      <header class="panel top-panel">
        <p class="eyebrow">PET SLIME</p>
        <h1 id="pet-name">Mochi</h1>
        <p id="message" class="message" aria-live="polite">Mochi is happy to see you.</p>
      </header>

      <section class="play-panel" aria-label="Slime playground">
        <div id="stage" class="stage" aria-label="Mochi's play area">
          <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
          <div id="toy" class="toy" aria-hidden="true"></div>
          <div id="food" class="food" aria-hidden="true">🍓</div>
          <div id="sleep-fx" class="sleep-fx" aria-hidden="true"><span>Z</span><span>z</span><span>z</span></div>
          <div id="slime" class="slime" role="img" aria-label="A happy slime" tabindex="0"><span class="shine" aria-hidden="true"></span><span class="eye eye-left" aria-hidden="true"></span><span class="eye eye-right" aria-hidden="true"></span><span class="mouth" aria-hidden="true"></span></div>
          <span id="slime-shadow" class="slime-shadow" aria-hidden="true"></span>
        </div>

        <section id="care-food" class="care-sheet" aria-label="Food choices"><div class="care-grid">
          <button class="care-option" data-food="🍓" aria-label="Strawberry" title="Strawberry"><span>🍓</span><span>Strawberry</span></button>
          <button class="care-option" data-food="🍏" aria-label="Green apple" title="Green apple"><span>🍏</span><span>Green apple</span></button>
          <button class="care-option" data-food="🍪" aria-label="Cookie" title="Cookie"><span>🍪</span><span>Cookie</span></button>
          <button class="care-option" data-food="🍇" aria-label="Grapes" title="Grapes"><span>🍇</span><span>Grapes</span></button>
          <button class="care-option" data-food="🍉" aria-label="Watermelon" title="Watermelon"><span>🍉</span><span>Watermelon</span></button>
          <button class="care-option" data-food="🥕" aria-label="Carrot" title="Carrot"><span>🥕</span><span>Carrot</span></button>
        </div></section>

        <section id="care-play" class="care-sheet" aria-label="Play choices"><div class="care-grid"></div></section>
        <section id="care-interact" class="care-sheet" aria-label="Command interactions"><div class="care-grid"></div></section>
        <section id="care-home" class="care-sheet" aria-label="Home and rest choices"><div class="care-grid"></div></section>

        <div class="floating-settings" aria-label="Pet settings"><div id="settings-menu" class="settings-menu" hidden><button id="rename" type="button">Rename</button><button id="slime-color" type="button">Slime color</button><button id="background" type="button">Background</button><button id="howto" type="button" aria-expanded="false">How to</button><div id="howto-panel" class="howto-panel" hidden><strong>Free interaction</strong><span>Tap · double tap · hold · rub · drag · toss</span><span>Interact contains commands and tricks instead of duplicate gestures.</span></div><button id="reset" type="button">Reset</button></div><button id="settings-toggle" class="settings-toggle" type="button" aria-label="Open settings" aria-expanded="false">+</button></div>
      </section>

      <section class="panel bottom-panel" aria-label="Pet status and actions">
        <section class="stats" aria-label="Pet stats"><div class="stat"><div class="stat-label"><span>Happiness</span><strong id="happiness-value">80</strong></div><progress id="happiness" max="100" value="80">80%</progress></div><div class="stat"><div class="stat-label"><span>Fullness</span><strong id="fullness-value">70</strong></div><progress id="fullness" max="100" value="70">70%</progress></div><div class="stat"><div class="stat-label"><span>Energy</span><strong id="energy-value">85</strong></div><progress id="energy" max="100" value="85">85%</progress></div></section>
        <section class="actions" aria-label="Care areas">
          <button type="button" data-care="food"><span class="action-icon">🍓</span><span>Food</span></button>
          <button type="button" data-care="play"><span class="action-icon">🎲</span><span>Play</span></button>
          <button type="button" data-care="interact"><span class="action-icon">👋</span><span>Interact</span></button>
          <button type="button" data-care="home"><span class="action-icon">🏠</span><span>Home</span></button>
        </section>
      </section>
    </section>
  </main>
  <script src="script.js?v=20260923-25"></script>
  <script src="care.js?v=20260923-25"></script>
  <script src="audio.js?v=20260923-25"></script>
  <script src="bgm.js?v=20260923-25"></script>
</body>
</html>
