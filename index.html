<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff6e8">
  <meta name="description" content="A tiny interactive slime pet that lives in your browser.">
  <title>Pet Slime</title>
  <link rel="stylesheet" href="styles.css?v=20260923-7">
  <style>
    .panel {
      background: rgba(255,255,255,.44) !important;
      border-color: rgba(255,255,255,.64) !important;
      box-shadow: 0 14px 38px rgba(52,94,74,.08) !important;
      backdrop-filter: blur(14px) saturate(1.08) !important;
      -webkit-backdrop-filter: blur(14px) saturate(1.08) !important;
    }

    .play-panel,.stage { min-height: 360px; height: 360px; }

    .care-sheet {
      position:absolute;
      left:10px;
      top:50%;
      z-index:26;
      width:90px;
      padding:7px;
      border:1px solid rgba(255,255,255,.58);
      border-radius:18px;
      background:rgba(255,255,255,.38);
      box-shadow:0 10px 28px rgba(52,94,74,.10);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      transform:translate(-118%,-50%) scale(.9);
      opacity:0;
      pointer-events:none;
      transition:transform .2s ease,opacity .16s ease;
    }
    .care-sheet.open { transform:translate(0,-50%) scale(1); opacity:1; pointer-events:auto; }
    .care-grid { display:grid; grid-template-columns:repeat(2,34px); justify-content:center; gap:7px; }
    .care-option {
      width:34px; height:34px; padding:0; border:1px solid rgba(255,255,255,.72); border-radius:50%;
      background:rgba(255,255,255,.7); box-shadow:0 5px 13px rgba(52,94,74,.08);
      display:grid; place-items:center; color:#395447; cursor:pointer; touch-action:manipulation;
      transition:transform .14s ease,background .14s ease,box-shadow .14s ease;
    }
    .care-option:hover { transform:translateY(-1px); }
    .care-option:active { transform:scale(.93); }
    .care-option.active { background:rgba(255,255,255,.96); box-shadow:0 0 0 3px rgba(91,176,131,.16),0 6px 15px rgba(52,94,74,.11); }
    .care-option span:first-child { font-size:1.05rem; line-height:1; font-weight:800; }
    .care-option span:last-child { display:none; }

    .floating-settings { position:absolute; right:12px; top:12px; z-index:40; pointer-events:auto; touch-action:manipulation; }
    .floating-settings .settings-toggle { position:relative; width:34px; height:34px; margin:0 0 0 auto; pointer-events:auto; touch-action:manipulation; font-size:1.15rem; background:rgba(255,255,255,.72); box-shadow:0 6px 18px rgba(46,91,69,.12); }
    .floating-settings .settings-menu { position:absolute; right:0; top:43px; z-index:41; width:176px; padding:0; border:0; background:transparent; box-shadow:none; backdrop-filter:none; pointer-events:auto; touch-action:manipulation; }
    .floating-settings .settings-menu[hidden] { display:none !important; }
    .floating-settings .settings-menu button { width:100%; margin-top:6px; padding:10px 11px; border:1px solid rgba(255,255,255,.84); border-radius:14px; background:rgba(255,255,255,.86); box-shadow:0 8px 22px rgba(52,94,74,.11); backdrop-filter:blur(14px); text-align:left; pointer-events:auto; touch-action:manipulation; }
    .floating-settings .howto-panel { margin:6px 0 0; padding:10px 11px; border:1px solid rgba(255,255,255,.84); border-radius:14px; background:rgba(255,255,255,.9); box-shadow:0 8px 22px rgba(52,94,74,.11); backdrop-filter:blur(14px); pointer-events:auto; }

    .particle.food-crumb { color:#d96f82; font-size:.72rem !important; font-weight:900; text-shadow:0 1px 0 rgba(255,255,255,.45); animation:particleRise .6s ease-out forwards; }
    .particle.apple-bit { color:#84a94f; }
    .particle.cookie-bit { color:#a86f42; }
    .particle.grape-bit { color:#8664af; }
    .particle.melon-bit { color:#ef7580; }
    .particle.carrot-bit { color:#e9983e; }
    .particle.ball-pop { color:#5f89bb; font-weight:800; }
    .particle.bubble-pop { color:#79b9c9; font-weight:800; }
    .particle.feather-swish { color:#a98a66; }
    .particle.butterfly-spark { color:#b47bc7; }
    .particle.light-dot { color:#5d91d8; }
    .particle.tv-note { color:#8b78b6; }
    .particle.shower-drop { color:#62a9d1; font-weight:900; }
    .particle.command-spark { color:#e4ad49; font-weight:900; }
    .particle.command-peace { color:#8664af; font-weight:900; }
    .particle.command-wave { color:#63a98a; }
    .particle.command-hide { color:#587064; }
    .particle.command-dust { color:#a58a67; }

    .toy.emoji-toy {
      display:grid; place-items:center; width:42px; height:42px; margin:0; background:none; box-shadow:none;
      font-size:1.9rem; line-height:1; opacity:0; pointer-events:none;
      filter:drop-shadow(0 5px 5px rgba(44,69,57,.12));
    }
    .toy.emoji-toy.show { opacity:1; }

    /* PLAY - deliberately different spaces and paths */
    .toy.play-yarn { left:50%; bottom:54px; color:#9d6caf; font-size:2rem; }
    .toy.play-yarn.show { animation:yarnGround 3.6s ease-in-out both; }
    .toy.play-ball { left:50%; bottom:52px; color:#507ca8; font-size:2.15rem; }
    .toy.play-ball.show { animation:ballGround 3.6s cubic-bezier(.22,.72,.35,1) both; }
    .toy.play-bubble { left:50%; bottom:86px; color:#78b7c8; font-size:2.35rem; }
    .toy.play-bubble.show { animation:bubbleFloat 4s ease-out both; }
    .toy.play-feather { left:50%; bottom:165px; color:#9f8466; font-size:2rem; }
    .toy.play-feather.show { animation:featherDrift 3.9s ease-in-out both; }
    .toy.play-butterfly { left:50%; bottom:168px; color:#a76fbd; font-size:2.2rem; }
    .toy.play-butterfly.show { animation:butterflyFlight 4.3s ease-in-out both; }
    .toy.play-chase { left:50%; bottom:125px; color:#4b86d1; font-size:2.2rem; text-shadow:0 0 9px rgba(75,134,209,.55); }
    .toy.play-chase.show { animation:lightChase 3.8s linear both; }

    @keyframes yarnGround {
      0% { opacity:0; transform:translate(120px,7px) rotate(0) scale(.55); }
      10% { opacity:1; }
      28% { transform:translate(62px,2px) rotate(-130deg) scale(1); }
      48% { transform:translate(-42px,6px) rotate(-300deg) scale(.92); }
      68% { transform:translate(18px,1px) rotate(-470deg) scale(1.05); }
      86% { opacity:1; transform:translate(78px,6px) rotate(-620deg) scale(.9); }
      100% { opacity:0; transform:translate(118px,8px) rotate(-720deg) scale(.65); }
    }
    @keyframes ballGround {
      0% { opacity:0; transform:translate(-120px,0) scale(.55); }
      8% { opacity:1; }
      20% { transform:translate(-76px,-64px) rotate(90deg); }
      34% { transform:translate(-35px,2px) rotate(180deg) scale(1.12,.88); }
      48% { transform:translate(5px,-52px) rotate(260deg); }
      62% { transform:translate(44px,2px) rotate(340deg) scale(1.08,.9); }
      76% { transform:translate(78px,-36px) rotate(420deg); }
      90% { opacity:1; transform:translate(105px,2px) rotate(500deg) scale(1.05,.92); }
      100% { opacity:0; transform:translate(128px,-14px) rotate(560deg) scale(.7); }
    }
    @keyframes bubbleFloat {
      0% { opacity:0; transform:translate(20px,48px) scale(.35); }
      12% { opacity:1; }
      30% { transform:translate(-36px,5px) scale(.75); }
      48% { transform:translate(30px,-48px) scale(1); }
      66% { transform:translate(-24px,-92px) scale(1.18); }
      84% { opacity:1; transform:translate(24px,-132px) scale(1.34); }
      100% { opacity:0; transform:translate(-10px,-175px) scale(1.55); }
    }
    @keyframes featherDrift {
      0% { opacity:0; transform:translate(90px,-10px) rotate(20deg) scale(.65); }
      10% { opacity:1; }
      28% { transform:translate(28px,-34px) rotate(-22deg); }
      46% { transform:translate(-54px,-12px) rotate(19deg); }
      64% { transform:translate(12px,10px) rotate(-28deg); }
      82% { opacity:1; transform:translate(-34px,34px) rotate(24deg); }
      100% { opacity:0; transform:translate(48px,62px) rotate(-18deg) scale(.72); }
    }
    @keyframes butterflyFlight {
      0% { opacity:0; transform:translate(-90px,18px) rotate(-7deg) scale(.55); }
      10% { opacity:1; }
      24% { transform:translate(-34px,-38px) rotate(8deg) scale(.95); }
      40% { transform:translate(42px,-18px) rotate(-7deg) scale(1.08); }
      56% { transform:translate(72px,-68px) rotate(9deg); }
      72% { transform:translate(6px,-92px) rotate(-8deg) scale(1.12); }
      86% { opacity:1; transform:translate(-58px,-58px) rotate(10deg); }
      100% { opacity:0; transform:translate(-92px,-126px) rotate(-12deg) scale(.6); }
    }
    @keyframes lightChase {
      0% { opacity:0; transform:translate(-115px,58px) scale(.6); }
      8% { opacity:1; }
      20% { transform:translate(-50px,-48px) scale(1); }
      34% { transform:translate(90px,-10px) scale(.72); }
      48% { transform:translate(26px,62px) scale(1.12); }
      62% { transform:translate(-85px,8px) scale(.78); }
      76% { transform:translate(58px,-68px) scale(1.08); }
      90% { opacity:1; transform:translate(98px,34px) scale(.76); }
      100% { opacity:0; transform:translate(126px,-12px) scale(.5); }
    }

    /* HOME scenes: CSS-drawn so they do not depend on newer emoji fonts */
    .toy.home-tv,.toy.home-shower,.toy.home-bed { color:transparent; filter:none; }

    .toy.home-tv { left:50%; bottom:50px; width:92px; height:72px; z-index:3; }
    .toy.home-tv::before {
      content:""; position:absolute; inset:0 5px 10px; border-radius:10px; border:5px solid #4e5a57;
      background:linear-gradient(145deg,#bfe2ee,#8fb9cd 55%,#dce8e5); box-shadow:0 8px 18px rgba(50,69,62,.18);
    }
    .toy.home-tv::after {
      content:""; position:absolute; left:31px; bottom:0; width:30px; height:10px; border-radius:4px 4px 2px 2px; background:#59635f;
    }
    .toy.home-tv.show { animation:tvRest 5.2s ease both; }
    @keyframes tvRest {
      0% { opacity:0; transform:translate(125px,8px) scale(.7); }
      12%,88% { opacity:1; transform:translate(96px,0) scale(1); }
      100% { opacity:0; transform:translate(96px,0) scale(.92); }
    }

    .toy.home-shower { left:50%; bottom:206px; width:88px; height:54px; z-index:7; }
    .toy.home-shower::before {
      content:""; position:absolute; left:22px; top:8px; width:52px; height:18px; border-radius:14px 14px 7px 7px;
      background:#728b95; box-shadow:inset 0 -5px 0 rgba(55,78,86,.18),0 6px 12px rgba(45,67,72,.15);
      transform:rotate(8deg);
    }
    .toy.home-shower::after {
      content:""; position:absolute; left:54px; top:-3px; width:8px; height:24px; border-radius:8px; background:#728b95;
    }
    .toy.home-shower.show { animation:showerHover 4.8s ease both; }
    @keyframes showerHover {
      0% { opacity:0; transform:translate(10px,-22px) scale(.78); }
      12%,88% { opacity:1; transform:translate(10px,0) scale(1); }
      100% { opacity:0; transform:translate(10px,5px) scale(.9); }
    }

    .toy.home-bed { left:50%; bottom:24px; width:210px; height:74px; z-index:2; }
    .toy.home-bed::before {
      content:""; position:absolute; left:-105px; bottom:0; width:210px; height:48px; border-radius:18px 18px 13px 13px;
      background:linear-gradient(#d6d1ec,#bbb3dc); border:4px solid rgba(95,86,135,.16); box-shadow:0 10px 18px rgba(62,63,88,.15);
    }
    .toy.home-bed::after {
      content:""; position:absolute; left:-91px; bottom:35px; width:70px; height:30px; border-radius:16px;
      background:#f5f1fb; box-shadow:0 3px 8px rgba(80,73,105,.09);
    }
    .toy.home-bed.show { animation:bedSlide 6.2s ease both; }
    @keyframes bedSlide {
      0% { opacity:0; transform:translateX(-80px) scale(.82); }
      12%,90% { opacity:1; transform:translateX(0) scale(1); }
      100% { opacity:0; transform:translateX(0) scale(.95); }
    }
    .sleep-fx.long-rest.show { animation:zzz 5.7s ease both; }

    /* COMMAND / TRICK interactions */
    .slime.cmd-highfive { animation:cmdHighFive 1.8s cubic-bezier(.2,.78,.25,1) both; z-index:12; }
    @keyframes cmdHighFive {
      0%,100% { transform:translate3d(var(--x),var(--y),0) scale(1); }
      18% { transform:translate3d(var(--x),calc(var(--y) + 12px),0) scale(1.12,.76); }
      48% { transform:translate3d(var(--x),calc(var(--y) - 72px),0) scale(1.58); filter:brightness(1.04); }
      60% { transform:translate3d(var(--x),calc(var(--y) - 62px),0) scale(1.5); }
      82% { transform:translate3d(var(--x),calc(var(--y) + 4px),0) scale(1.13,.82); }
    }
    .slime.cmd-peace { animation:cmdPeace 2.1s ease both; }
    @keyframes cmdPeace {
      0%,100% { transform:translate3d(var(--x),var(--y),0); }
      25% { transform:translate3d(calc(var(--x) - 8px),calc(var(--y) - 10px),0) rotate(-5deg); }
      55% { transform:translate3d(calc(var(--x) + 8px),calc(var(--y) - 15px),0) rotate(5deg) scale(1.04); }
      80% { transform:translate3d(var(--x),calc(var(--y) - 6px),0); }
    }
    .slime.cmd-peace .eye { height:5px; top:66px; box-shadow:none; }
    .slime.cmd-wave { animation:cmdWave 2.3s ease-in-out both; }
    @keyframes cmdWave {
      0%,100% { transform:translate3d(var(--x),var(--y),0) rotate(0); }
      20% { transform:translate3d(var(--x),calc(var(--y) - 7px),0) rotate(-9deg); }
      40% { transform:translate3d(var(--x),calc(var(--y) - 3px),0) rotate(10deg); }
      60% { transform:translate3d(var(--x),calc(var(--y) - 7px),0) rotate(-9deg); }
      80% { transform:translate3d(var(--x),calc(var(--y) - 3px),0) rotate(8deg); }
    }
    .slime.cmd-hide-left { animation:cmdHideLeft 3s ease both; }
    .slime.cmd-hide-right { animation:cmdHideRight 3s ease both; }
    @keyframes cmdHideLeft {
      0%,100% { transform:translate3d(var(--x),var(--y),0); }
      25%,72% { transform:translate3d(calc(var(--x) - 185px),var(--y),0) rotate(-4deg); }
      48% { transform:translate3d(calc(var(--x) - 168px),var(--y),0) rotate(4deg); }
    }
    @keyframes cmdHideRight {
      0%,100% { transform:translate3d(var(--x),var(--y),0); }
      25%,72% { transform:translate3d(calc(var(--x) + 185px),var(--y),0) rotate(4deg); }
      48% { transform:translate3d(calc(var(--x) + 168px),var(--y),0) rotate(-4deg); }
    }
    .slime.cmd-dig { animation:cmdDig 3s ease both; }
    @keyframes cmdDig {
      0%,100% { transform:translate3d(var(--x),var(--y),0); }
      24% { transform:translate3d(var(--x),calc(var(--y) + 45px),0) scale(1.08,.82); }
      44%,70% { transform:translate3d(var(--x),calc(var(--y) + 116px),0) scale(.96); }
      82% { transform:translate3d(var(--x),calc(var(--y) + 45px),0) scale(1.08,.82); }
    }
    .slime.cmd-dance { animation:cmdDance 3.3s ease-in-out both; }
    @keyframes cmdDance {
      0%,100% { transform:translate3d(var(--x),var(--y),0); }
      12% { transform:translate3d(calc(var(--x) - 24px),calc(var(--y) - 18px),0) rotate(-10deg) scale(1.05); }
      26% { transform:translate3d(calc(var(--x) + 24px),calc(var(--y) - 6px),0) rotate(10deg); }
      40% { transform:translate3d(calc(var(--x) - 20px),calc(var(--y) - 25px),0) rotate(-8deg); }
      54% { transform:translate3d(calc(var(--x) + 22px),calc(var(--y) - 8px),0) rotate(9deg); }
      68% { transform:translate3d(calc(var(--x) - 15px),calc(var(--y) - 20px),0) rotate(-7deg); }
      84% { transform:translate3d(calc(var(--x) + 12px),calc(var(--y) - 5px),0) rotate(6deg); }
    }

    @media (max-width:420px) {
      .play-panel,.stage { min-height:340px; height:340px; }
      .care-sheet { left:6px; width:84px; padding:6px; }
      .care-grid { grid-template-columns:repeat(2,32px); gap:6px; }
      .care-option { width:32px; height:32px; }
      .care-option span:first-child { font-size:1rem; }
      .floating-settings { right:8px; top:8px; }
      .floating-settings .settings-toggle { width:34px; height:34px; font-size:1.05rem; }
      .floating-settings .settings-menu { width:min(178px,62vw); top:42px; }
      .toy.home-tv { transform-origin:center; }
      .toy.home-bed { width:190px; }
      .toy.home-bed::before { left:-95px; width:190px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="pet-name">
    <section class="pet-shell">
      <header class="panel top-panel">
        <p class="eyebrow">PET SLIME</p>
        <h1 id="pet-name">Mochi</h1>
        <p id="message" class="message" aria-live="polite">Mochi is happy to see you.</p>
      </header>

      <section class="play-panel" aria-label="Slime playground">
        <div id="stage" class="stage" aria-label="Mochi's play area">
          <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
          <div id="toy" class="toy" aria-hidden="true"></div>
          <div id="food" class="food" aria-hidden="true">🍓</div>
          <div id="sleep-fx" class="sleep-fx" aria-hidden="true"><span>Z</span><span>z</span><span>z</span></div>
          <div id="slime" class="slime" role="img" aria-label="A happy slime" tabindex="0">
            <span class="shine" aria-hidden="true"></span>
            <span class="eye eye-left" aria-hidden="true"></span>
            <span class="eye eye-right" aria-hidden="true"></span>
            <span class="mouth" aria-hidden="true"></span>
          </div>
          <span id="slime-shadow" class="slime-shadow" aria-hidden="true"></span>
        </div>

        <section id="care-food" class="care-sheet" aria-label="Food choices"><div class="care-grid">
          <button class="care-option" data-food="🍓" aria-label="Strawberry" title="Strawberry"><span>🍓</span><span>Strawberry</span></button>
          <button class="care-option" data-food="🍏" aria-label="Green apple" title="Green apple"><span>🍏</span><span>Green apple</span></button>
          <button class="care-option" data-food="🍪" aria-label="Cookie" title="Cookie"><span>🍪</span><span>Cookie</span></button>
          <button class="care-option" data-food="🍇" aria-label="Grapes" title="Grapes"><span>🍇</span><span>Grapes</span></button>
          <button class="care-option" data-food="🍉" aria-label="Watermelon" title="Watermelon"><span>🍉</span><span>Watermelon</span></button>
          <button class="care-option" data-food="🥕" aria-label="Carrot" title="Carrot"><span>🥕</span><span>Carrot</span></button>
        </div></section>

        <section id="care-play" class="care-sheet" aria-label="Play choices"><div class="care-grid">
          <button class="care-option" data-play="yarn" aria-label="Yarn" title="Yarn"><span>Y</span><span>Yarn</span></button>
          <button class="care-option" data-play="ball" aria-label="Ball" title="Ball"><span>●</span><span>Ball</span></button>
          <button class="care-option" data-play="bubble" aria-label="Bubbles" title="Bubbles"><span>○</span><span>Bubbles</span></button>
          <button class="care-option" data-play="feather" aria-label="Feather" title="Feather"><span>~</span><span>Feather</span></button>
          <button class="care-option" data-play="butterfly" aria-label="Butterfly" title="Butterfly"><span>✦</span><span>Butterfly</span></button>
          <button class="care-option" data-play="chase" aria-label="Light chase" title="Light chase"><span>•</span><span>Light chase</span></button>
        </div></section>

        <section id="care-interact" class="care-sheet" aria-label="Command interactions"><div class="care-grid">
          <button class="care-option" data-interact="highfive" aria-label="High five" title="High five"><span>↑</span><span>High five</span></button>
          <button class="care-option" data-interact="peace" aria-label="Peace" title="Peace"><span>V</span><span>Peace</span></button>
          <button class="care-option" data-interact="wave" aria-label="Wave" title="Wave"><span>~</span><span>Wave</span></button>
          <button class="care-option" data-interact="hide" aria-label="Hide" title="Hide"><span>◀</span><span>Hide</span></button>
          <button class="care-option" data-interact="dig" aria-label="Dig" title="Dig"><span>↓</span><span>Dig</span></button>
          <button class="care-option" data-interact="dance" aria-label="Dance" title="Dance"><span>♪</span><span>Dance</span></button>
        </div></section>

        <section id="care-home" class="care-sheet" aria-label="Home and rest choices"><div class="care-grid">
          <button class="care-option" data-home="tv" aria-label="TV" title="TV"><span>TV</span><span>TV</span></button>
          <button class="care-option" data-home="shower" aria-label="Shower" title="Shower"><span>≋</span><span>Shower</span></button>
          <button class="care-option" data-home="bed" aria-label="Bed" title="Bed"><span>Zz</span><span>Bed</span></button>
        </div></section>

        <div class="floating-settings" aria-label="Pet settings">
          <div id="settings-menu" class="settings-menu" hidden>
            <button id="rename" type="button">Rename</button>
            <button id="slime-color" type="button">Slime color</button>
            <button id="background" type="button">Background</button>
            <button id="howto" type="button" aria-expanded="false">How to</button>
            <div id="howto-panel" class="howto-panel" hidden>
              <strong>Free interaction</strong>
              <span>Tap · double tap · hold · rub · drag · toss</span>
              <span>Interact contains commands and tricks instead of duplicate gestures.</span>
            </div>
            <button id="reset" type="button">Reset</button>
          </div>
          <button id="settings-toggle" class="settings-toggle" type="button" aria-label="Open settings" aria-expanded="false">+</button>
        </div>
      </section>

      <section class="panel bottom-panel" aria-label="Pet status and actions">
        <section class="stats" aria-label="Pet stats">
