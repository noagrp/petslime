<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff6e8">
  <meta name="description" content="A tiny interactive slime pet that lives in your browser.">
  <title>Pet Slime</title>
  <link rel="stylesheet" href="styles.css?v=20260923-6">
  <style>
    .panel {
      background: rgba(255,255,255,.44) !important;
      border-color: rgba(255,255,255,.64) !important;
      box-shadow: 0 14px 38px rgba(52,94,74,.08) !important;
      backdrop-filter: blur(14px) saturate(1.08) !important;
      -webkit-backdrop-filter: blur(14px) saturate(1.08) !important;
    }

    .play-panel,.stage { min-height: 360px; height: 360px; }

    .care-sheet {
      position: absolute;
      left: 10px;
      top: 50%;
      z-index: 26;
      width: 90px;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 18px;
      background: rgba(255,255,255,.38);
      box-shadow: 0 10px 28px rgba(52,94,74,.10);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transform: translate(-118%, -50%) scale(.9);
      opacity: 0;
      pointer-events: none;
      transition: transform .2s ease, opacity .16s ease;
    }

    .care-sheet.open {
      transform: translate(0, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .care-grid {
      display: grid;
      grid-template-columns: repeat(2, 34px);
      justify-content: center;
      gap: 7px;
    }

    .care-option {
      position: relative;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 50%;
      background: rgba(255,255,255,.7);
      box-shadow: 0 5px 13px rgba(52,94,74,.08);
      display: grid;
      place-items: center;
      color: #395447;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
    }

    .care-option:hover { transform: translateY(-1px); }
    .care-option:active { transform: scale(.93); }
    .care-option.active {
      background: rgba(255,255,255,.96);
      box-shadow: 0 0 0 3px rgba(91,176,131,.16), 0 6px 15px rgba(52,94,74,.11);
    }
    .care-option span:first-child { font-size: 1.22rem; line-height: 1; }
    .care-option span:last-child { display: none; }

    .floating-settings { position:absolute; right:12px; top:12px; z-index:40; pointer-events:auto; touch-action:manipulation; }
    .floating-settings .settings-toggle { position:relative; width:34px; height:34px; margin:0 0 0 auto; pointer-events:auto; touch-action:manipulation; font-size:1.15rem; background:rgba(255,255,255,.72); box-shadow:0 6px 18px rgba(46,91,69,.12); }
    .floating-settings .settings-menu { position:absolute; right:0; top:43px; z-index:41; width:176px; padding:0; border:0; background:transparent; box-shadow:none; backdrop-filter:none; pointer-events:auto; touch-action:manipulation; }
    .floating-settings .settings-menu[hidden] { display:none !important; }
    .floating-settings .settings-menu button { width:100%; margin-top:6px; padding:10px 11px; border:1px solid rgba(255,255,255,.84); border-radius:14px; background:rgba(255,255,255,.86); box-shadow:0 8px 22px rgba(52,94,74,.11); backdrop-filter:blur(14px); text-align:left; pointer-events:auto; touch-action:manipulation; }
    .floating-settings .howto-panel { margin:6px 0 0; padding:10px 11px; border:1px solid rgba(255,255,255,.84); border-radius:14px; background:rgba(255,255,255,.9); box-shadow:0 8px 22px rgba(52,94,74,.11); backdrop-filter:blur(14px); pointer-events:auto; }

    .particle.food-crumb { color:#d96f82; font-size:.72rem !important; font-weight:900; text-shadow:0 1px 0 rgba(255,255,255,.45); animation:particleRise .6s ease-out forwards; }
    .particle.apple-bit { color:#84a94f; }
    .particle.cookie-bit { color:#a86f42; }
    .particle.grape-bit { color:#8664af; }
    .particle.melon-bit { color:#ef7580; }
    .particle.carrot-bit { color:#e9983e; }
    .particle.ball-pop { color:#5f89bb; font-weight:800; }
    .particle.bubble-pop { color:#79b9c9; font-weight:800; }
    .particle.feather-swish { color:#a98a66; }
    .particle.butterfly-spark { color:#b47bc7; }
    .particle.light-dot { color:#5d91d8; }
    .particle.squish-dot { color:#68b98e; }
    .particle.tv-note { color:#8b78b6; }
    .particle.shower-drop { color:#62a9d1; }
    .particle.bed-dot { color:#8f83ae; }

    .toy.emoji-toy {
      display:grid;
      place-items:center;
      width:42px;
      height:42px;
      margin:0;
      background:none;
      box-shadow:none;
      font-size:1.9rem;
      line-height:1;
      opacity:0;
      pointer-events:none;
      filter:drop-shadow(0 5px 5px rgba(44,69,57,.12));
    }
    .toy.emoji-toy.show { opacity:1; }

    .toy.play-yarn { left:50%; bottom:54px; }
    .toy.play-yarn.show { animation:yarnGround 1.35s ease both; }
    .toy.play-ball { left:50%; bottom:52px; }
    .toy.play-ball.show { animation:ballGround 1.45s cubic-bezier(.22,.72,.35,1) both; }
    .toy.play-bubble { left:50%; bottom:92px; }
    .toy.play-bubble.show { animation:bubbleFloat 1.65s ease-out both; }
    .toy.play-feather { left:50%; bottom:160px; }
    .toy.play-feather.show { animation:featherDrift 1.7s ease-in-out both; }
    .toy.play-butterfly { left:50%; bottom:170px; }
    .toy.play-butterfly.show { animation:butterflyFlight 1.9s ease-in-out both; }
    .toy.play-chase { left:50%; bottom:125px; font-size:1.35rem; }
    .toy.play-chase.show { animation:lightChase 1.65s linear both; }

    .toy.home-tv { left:50%; bottom:52px; }
    .toy.home-tv.show { animation:tvRest 2.1s ease both; }
    .toy.home-shower { left:50%; bottom:180px; }
    .toy.home-shower.show { animation:showerHover 1.8s ease both; }
    .toy.home-bed { left:50%; bottom:42px; }
    .toy.home-bed.show { animation:bedSlide 1.7s ease both; }

    @keyframes yarnGround {
      0% { opacity:0; transform:translate(115px,6px) rotate(0) scale(.65); }
      18% { opacity:1; }
      42% { transform:translate(58px,0) rotate(-85deg) scale(1); }
      68% { transform:translate(-18px,4px) rotate(-190deg) scale(.95); }
      88% { opacity:1; transform:translate(38px,0) rotate(-280deg); }
      100% { opacity:0; transform:translate(78px,5px) rotate(-360deg) scale(.8); }
    }
    @keyframes ballGround {
      0% { opacity:0; transform:translate(-115px,0) scale(.65); }
      12% { opacity:1; }
      26% { transform:translate(-64px,-55px) rotate(90deg); }
      44% { transform:translate(-20px,2px) rotate(180deg) scale(1.08,.9); }
      62% { transform:translate(28px,-37px) rotate(250deg); }
      80% { transform:translate(66px,2px) rotate(315deg) scale(1.05,.92); }
      100% { opacity:0; transform:translate(112px,-18px) rotate(410deg) scale(.8); }
    }
    @keyframes bubbleFloat {
      0% { opacity:0; transform:translate(10px,35px) scale(.45); }
      15% { opacity:1; }
      38% { transform:translate(-35px,-5px) scale(.85); }
      62% { transform:translate(30px,-52px) scale(1.08); }
      82% { opacity:1; transform:translate(-18px,-90px) scale(1.22); }
      100% { opacity:0; transform:translate(22px,-132px) scale(1.5); }
    }
    @keyframes featherDrift {
      0% { opacity:0; transform:translate(80px,-5px) rotate(18deg) scale(.7); }
      15% { opacity:1; }
      35% { transform:translate(25px,-24px) rotate(-18deg); }
      58% { transform:translate(-42px,-10px) rotate(15deg); }
      78% { transform:translate(8px,8px) rotate(-22deg); }
      100% { opacity:0; transform:translate(-60px,32px) rotate(28deg) scale(.8); }
    }
    @keyframes butterflyFlight {
      0% { opacity:0; transform:translate(-78px,12px) rotate(-8deg) scale(.65); }
      12% { opacity:1; }
      30% { transform:translate(-28px,-35px) rotate(8deg) scale(1); }
      48% { transform:translate(35px,-18px) rotate(-6deg); }
      66% { transform:translate(62px,-62px) rotate(10deg) scale(1.08); }
      82% { opacity:1; transform:translate(8px,-80px) rotate(-8deg); }
      100% { opacity:0; transform:translate(-48px,-112px) rotate(12deg) scale(.72); }
    }
    @keyframes lightChase {
      0% { opacity:0; transform:translate(-105px,50px) scale(.6); }
      10% { opacity:1; }
      24% { transform:translate(-40px,-38px) scale(1); }
      38% { transform:translate(82px,-10px) scale(.8); }
      54% { transform:translate(24px,58px) scale(1.05); }
      70% { transform:translate(-72px,8px) scale(.85); }
      86% { opacity:1; transform:translate(58px,-58px) scale(1.05); }
      100% { opacity:0; transform:translate(105px,16px) scale(.6); }
    }
    @keyframes tvRest {
      0% { opacity:0; transform:translate(105px,8px) scale(.65); }
      18%,82% { opacity:1; transform:translate(82px,0) scale(1); }
      100% { opacity:0; transform:translate(82px,0) scale(.9); }
    }
    @keyframes showerHover {
      0% { opacity:0; transform:translate(8px,-25px) scale(.7); }
      18%,82% { opacity:1; transform:translate(8px,0) scale(1); }
      100% { opacity:0; transform:translate(8px,10px) scale(.85); }
    }
    @keyframes bedSlide {
      0% { opacity:0; transform:translate(-118px,8px) scale(.7); }
      20%,82% { opacity:1; transform:translate(-92px,0) scale(1); }
      100% { opacity:0; transform:translate(-92px,0) scale(.9); }
    }

    @media (max-width:420px) {
      .play-panel,.stage { min-height:340px; height:340px; }
      .care-sheet { left:6px; width:84px; padding:6px; }
      .care-grid { grid-template-columns:repeat(2,32px); gap:6px; }
      .care-option { width:32px; height:32px; }
      .care-option span:first-child { font-size:1.12rem; }
      .floating-settings { right:8px; top:8px; }
      .floating-settings .settings-toggle { width:34px; height:34px; font-size:1.05rem; }
      .floating-settings .settings-menu { width:min(178px,62vw); top:42px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="pet-name">
    <section class="pet-shell">
      <header class="panel top-panel">
        <p class="eyebrow">PET SLIME</p><h1 id="pet-name">Mochi</h1>
        <p id="message" class="message" aria-live="polite">Mochi is happy to see you.</p>
      </header>

      <section class="play-panel" aria-label="Slime playground">
        <div id="stage" class="stage" aria-label="Mochi's play area">
          <div id="fx-layer" class="fx-layer" aria-hidden="true"></div><div id="toy" class="toy" aria-hidden="true"></div>
          <div id="food" class="food" aria-hidden="true">🍓</div><div id="sleep-fx" class="sleep-fx" aria-hidden="true"><span>Z</span><span>z</span><span>z</span></div>
          <div id="slime" class="slime" role="img" aria-label="A happy slime" tabindex="0"><span class="shine" aria-hidden="true"></span><span class="eye eye-left" aria-hidden="true"></span><span class="eye eye-right" aria-hidden="true"></span><span class="mouth" aria-hidden="true"></span></div>
          <span id="slime-shadow" class="slime-shadow" aria-hidden="true"></span>
        </div>

        <section id="care-food" class="care-sheet" aria-label="Food choices"><div class="care-grid">
          <button class="care-option" data-food="🍓" aria-label="Strawberry" title="Strawberry"><span>🍓</span><span>Strawberry</span></button>
          <button class="care-option" data-food="🍏" aria-label="Green apple" title="Green apple"><span>🍏</span><span>Green apple</span></button>
          <button class="care-option" data-food="🍪" aria-label="Cookie" title="Cookie"><span>🍪</span><span>Cookie</span></button>
          <button class="care-option" data-food="🍇" aria-label="Grapes" title="Grapes"><span>🍇</span><span>Grapes</span></button>
          <button class="care-option" data-food="🍉" aria-label="Watermelon" title="Watermelon"><span>🍉</span><span>Watermelon</span></button>
          <button class="care-option" data-food="🥕" aria-label="Carrot" title="Carrot"><span>🥕</span><span>Carrot</span></button>
        </div></section>

        <section id="care-play" class="care-sheet" aria-label="Play choices"><div class="care-grid">
          <button class="care-option" data-play="yarn" aria-label="Yarn" title="Yarn"><span>🧶</span><span>Yarn</span></button>
          <button class="care-option" data-play="ball" aria-label="Ball" title="Ball"><span>⚽</span><span>Ball</span></button>
          <button class="care-option" data-play="bubble" aria-label="Bubbles" title="Bubbles"><span>🫧</span><span>Bubbles</span></button>
          <button class="care-option" data-play="feather" aria-label="Feather" title="Feather"><span>🪶</span><span>Feather</span></button>
          <button class="care-option" data-play="butterfly" aria-label="Butterfly" title="Butterfly"><span>🦋</span><span>Butterfly</span></button>
          <button class="care-option" data-play="chase" aria-label="Light chase" title="Light chase"><span>🔵</span><span>Light chase</span></button>
        </div></section>

        <section id="care-interact" class="care-sheet" aria-label="Interaction choices"><div class="care-grid">
          <button class="care-option" data-interact="pet" aria-label="Pet" title="Pet"><span>💚</span><span>Pet</span></button>
          <button class="care-option" data-interact="squish" aria-label="Squish" title="Squish"><span>🫳</span><span>Squish</span></button>
          <button class="care-option" data-interact="tap" aria-label="Tap" title="Tap"><span>👆</span><span>Tap</span></button>
          <button class="care-option" data-interact="double" aria-label="Double tap" title="Double tap"><span>✌️</span><span>Double tap</span></button>
          <button class="care-option" data-interact="pickup" aria-label="Pick up" title="Pick up"><span>🤲</span><span>Pick up</span></button>
          <button class="care-option" data-interact="rub" aria-label="Rub" title="Rub"><span>🫶</span><span>Rub</span></button>
        </div></section>

        <section id="care-home" class="care-sheet" aria-label="Home choices"><div class="care-grid">
          <button class="care-option" data-home="tv" aria-label="TV" title="TV"><span>📺</span><span>TV</span></button>
          <button class="care-option" data-home="shower" aria-label="Shower" title="Shower"><span>🚿</span><span>Shower</span></button>
          <button class="care-option" data-home="bed" aria-label="Bed" title="Bed"><span>🛏️</span><span>Bed</span></button>
        </div></section>

        <div class="floating-settings" aria-label="Pet settings"><div id="settings-menu" class="settings-menu" hidden><button id="rename" type="button">Rename</button><button id="slime-color" type="button">Slime color</button><button id="background" type="button">Background</button><button id="howto" type="button" aria-expanded="false">How to</button><div id="howto-panel" class="howto-panel" hidden><strong>Play with your slime</strong><span>Tap · double tap · hold · rub · drag · toss</span><span>Use Food, Play, Interact and Home for more choices.</span></div><button id="reset" type="button">Reset</button></div><button id="settings-toggle" class="settings-toggle" type="button" aria-label="Open settings" aria-expanded="false">+</button></div>
      </section>

      <section class="panel bottom-panel" aria-label="Pet status and actions">
        <section class="stats" aria-label="Pet stats"><div class="stat"><div class="stat-label"><span>Happiness</span><strong id="happiness-value">80</strong></div><progress id="happiness" max="100" value="80">80%</progress></div><div class="stat"><div class="stat-label"><span>Fullness</span><strong id="fullness-value">70</strong></div><progress id="fullness" max="100" value="70">70%</progress></div><div class="stat"><div class="stat-label"><span>Energy</span><strong id="energy-value">85</strong></div><progress id="energy" max="100" value="85">85%</progress></div></section>
        <section class="actions" aria-label="Care areas">
          <button type="button" data-care="food"><span class="action-icon">🍓</span><span>Food</span></button>
          <button type="button" data-care="play"><span class="action-icon">🧶</span><span>Play</span></button>
          <button type="button" data-care="interact"><span class="action-icon">💚</span><span>Interact</span></button>
          <button type="button" data-care="home"><span class="action-icon">🏠</span><span>Home</span></button>
        </section>
      </section>
    </section>
  </main>
  <script src="script.js?v=20260923-6"></script>
  <script src="care.js?v=20260923-6"></script>
</body>
</html>
